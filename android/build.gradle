// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // NOTE: previously hardcoded to "D:/gradle_builds/..." which broke the build
    // on any machine without that exact drive/folder (teammates, CI, judges).
    // If you want build output outside the source tree, use an env var instead:
    // buildDir = System.getenv("GRADLE_BUILD_DIR") ?: buildDir
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
