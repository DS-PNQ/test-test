# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

android.useAndroidX=true

# Suppress warnings for deprecated options if they are still needed by some plugins, 
# or just remove them if we are moving to newer AGP standards.
# The following were causing warnings in AGP 9.3.1:
# android.enableJetifier=true
# android.defaults.buildfeatures.resvalues=true
# android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
# android.enableAppCompileTimeRClass=false
# android.usesSdkInManifest.disallowed=false
# android.builtInKotlin=false
# android.newDsl=false
# android.r8.optimizedResourceShrinking=false

# Suggested performance and suppression flags:
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.useZip64=true
