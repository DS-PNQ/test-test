apply plugin: 'com.android.application'

android {
    namespace 'com.omnivoice.onspeak47'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.omnivoice.onspeak47"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'

        // Only build for ARM64 (mobile target per pipeline_overview.md)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lintOptions {
        abortOnError false
    }

    // Allow large ONNX model files in assets
    aaptOptions {
        noCompress 'onnx', 'model'
    }
}

dependencies {
    // AndroidX
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ONNX Runtime for on-device model inference
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.12.4'

    // ML Kit for language identification
    implementation 'com.google.mlkit:language-id:17.0.5'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
