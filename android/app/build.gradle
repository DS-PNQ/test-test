apply plugin: 'com.android.application'

android {
    namespace 'com.omnivoice.onspeak47'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.omnivoice.onspeak47"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'

        // Only build for ARM64 (mobile target per pipeline_overview.md)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    androidResources {
        noCompress 'onnx', 'model', 'onnx_data', 'json', 'bin'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    lint {
        abortOnError false
    }


    // Allow large ONNX model files in assets
}

dependencies {
    // AndroidX
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ONNX Runtime for on-device model inference
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.13.0'

    // NOTE: ai.djl.sentencepiece:sentencepiece was removed here. It only ships
    // native binaries for desktop/server JVMs (linux-x86_64, osx, win) — there
    // is no ai.djl.android:sentencepiece-native artifact — so SpTokenizer's
    // native lib never loads on-device. Tokenizer.java now parses the
    // SentencePiece model and runs BPE in pure Java instead, so this
    // dependency (and the plain ai.djl:api it dragged in) is no longer needed.

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
